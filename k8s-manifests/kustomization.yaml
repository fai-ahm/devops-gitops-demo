apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: app

resources:
- db-secret.yaml
- db-statefulset.yaml
- app-deployment.yaml
- servicemonitor.yaml
- grafana-dashboard.yaml
- prometheus-rules.yaml

# CI rewrites newTag to the short git commit SHA of each build. Never use :latest.
images:
- name: devops-app
  newName: ghcr.io/fai-ahm/devops-app
  newTag: 8023d3c

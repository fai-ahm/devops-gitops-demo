# Alerting rules as code. Prometheus only loads PrometheusRules carrying the
# release: kube-prometheus-stack label (its ruleSelector), so that label is required.
# Alertmanager is disabled: alerts show on Prometheus's Alerts page but aren't sent anywhere.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devops-app-alerts
  namespace: app
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: devops-app
      rules:
        - alert: AppDown
          # "or vector(0)" makes this fire even when no pods exist at all (e.g. scaled to 0)
          expr: (sum(up{namespace="app", service="devops-app-service"}) or vector(0)) < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: No healthy devops-app pods
            description: Prometheus has not been able to scrape any devops-app pod for 1 minute.

        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="app", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{namespace="app"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of requests fail with 5xx
            description: '{{ $value | humanizePercentage }} of devops-app requests returned a 5xx status over the last 5 minutes.'

        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="app"}[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: Pod {{ $labels.pod }} is restarting
            description: Container {{ $labels.container }} in pod {{ $labels.pod }} restarted {{ $value | humanize }} time(s) in the last 10 minutes.

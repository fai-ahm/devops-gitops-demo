apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: app
  labels:
    app: devops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # never drop below 3 ready pods during a rollout
      maxSurge: 1 # start one new pod at a time
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      # One replica per node. matchLabelKeys counts only pods of the same rollout revision,
      # so old pods that are about to be removed don't block placing new ones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: devops-app
          matchLabelKeys:
            - pod-template-hash
      securityContext:
        runAsNonRoot: true
      containers:
        - name: devops-app
          image: devops-app # real name and tag are set by kustomization.yaml
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DB_HOST
              value: db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_DB
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: devops-app-service
  namespace: app
  labels:
    app: devops-app # the ServiceMonitor finds this Service by this label
spec:
  selector:
    app: devops-app
  ports:
    - name: http # the ServiceMonitor refers to the port by this name
      port: 3000
      targetPort: http

# Demo credentials only. A plain Secret is just base64, so anyone with repo access can read it.
# In production, keep secrets out of Git with Sealed Secrets (encrypted in Git, decrypted in-cluster)
# or External Secrets Operator (pulled from Vault / AWS Secrets Manager / etc.).
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo-password-change-me
  POSTGRES_DB: demo

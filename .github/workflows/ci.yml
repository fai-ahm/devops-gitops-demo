name: CI

on:
  push:
    branches: [main]
    # Only app changes build a new image. The bot's commit to k8s-manifests/ doesn't match,
    # so it can't start another run.
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write # push the manifest update back to main
  packages: write # push images to ghcr.io

# Two quick pushes must not race each other when updating kustomization.yaml
concurrency:
  group: ci-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fai-ahm/devops-app

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tag (short commit SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.tag }}
          # Links the ghcr.io package to this repo (shows on the repo page, inherits access)
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    env:
      TAG: ${{ needs.build-and-push.outputs.tag }}
      KUSTOMIZE_VERSION: v5.8.3
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize (if missing)
        run: |
          if ! command -v kustomize >/dev/null; then
            curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_arm64.tar.gz" \
              | sudo tar -xz -C /usr/local/bin kustomize
          fi
          kustomize version

      - name: Point kustomization.yaml at the new image
        working-directory: k8s-manifests
        run: |
          kustomize edit set image "devops-app=${IMAGE}:${TAG}"
          git diff

      - name: Commit and push (ArgoCD deploys from this commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s-manifests/kustomization.yaml
          git commit -m "deploy: devops-app ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
